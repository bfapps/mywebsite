        <div class="accordion-wrapper">




            <!-- Menschen A1.1 -->
            <div class="accordion-item">
                <div class="accordion-header" onclick="toggleAccordion(this)">
                    <div class="header-left">
                        <div class="header-icon-box red-theme">
                            <i class="fa-solid fa-graduation-cap"></i>

                            <h3>Loading ...</h3>

        </div>

        <footer id="footer">
            <!--injected by JS from global JS-->
        </footer>
    </div>
    <script>
        window.PAGE_NAME = 'gevocab';
    </script>
    <script src="/global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <script>
        // ذخیره داده‌های دریافتی در حافظه برای جلوگیری از درخواست مکرر به Supabase
        let cachedBooksData = null;
        let isFetchingBooks = false;
        const tableSource = "german_words";

        async function loadBooksAndRenderUnits() {
            if (cachedBooksData) {
                renderBooksAndUnits(cachedBooksData);
                return;
            }

            if (isFetchingBooks) return;

            try {
                const client = window.supabaseClient || (typeof supabaseClient !== 'undefined' ? supabaseClient : null);

                if (!client) {
                    console.warn("Supabase client is not ready yet. Retrying in 100ms...");
                    setTimeout(loadBooksAndRenderUnits, 100);
                    return;
                }

                const unitContainers = document.querySelectorAll('.unit-list[id]');
                const bookKeys = Array.from(unitContainers)
                    .map(container => container.id)
                    .filter(id => id.trim() !== '');

                if (bookKeys.length === 0) return;

                isFetchingBooks = true;

                const { data: books, error } = await client
                    .from('books_data')
                    .select('*')
                    .in('book_key', bookKeys);

                if (error) {
                    console.error("خطا در دریافت اطلاعات کتاب‌ها:", error);
                    return;
                }

                cachedBooksData = books;
                renderBooksAndUnits(cachedBooksData);

            } catch (err) {
                console.error("خطای غیرمنتظره:", err);
            } finally {
                isFetchingBooks = false;
            }
        }

        function renderBooksAndUnits(books) {
            if (!books || books.length === 0) return;

            const lang = (typeof currentLang !== 'undefined') ? currentLang : 'en';

            books.forEach(book => {
                // ۱. به‌روزرسانی هدر کتاب
                const headerInfoBox = document.querySelector(`.header-info[data-header-key="${book.book_key}"]`);
                if (headerInfoBox) {
                    const titleH3 = headerInfoBox.querySelector('h3');
                    const descP = headerInfoBox.querySelector('p');

                    const bookTitle = (lang === 'fa') ? (book.title_fa || book.titleFa || book.title_en) : (book.title_en || book.titleFa);
                    const bookDesc = (lang === 'fa') ? (book.desc_fa || book.descFa || book.desc_en) : (book.desc_en || book.descFa);

                    if (titleH3 && bookTitle) titleH3.textContent = bookTitle;
                    if (descP && bookDesc) descP.textContent = bookDesc;
                }

                // ۲. به‌روزرسانی یونیت‌ها (فلش‌کارت + دکمه اختصاصی بازی)
                const targetContainer = document.getElementById(book.book_key);
                if (targetContainer && book.units_data) {
                    targetContainer.innerHTML = "";

                    book.units_data.forEach(item => {
                        // آدرس فلش‌کارت (لینک اصلی)
                        const flashcardUrl = `/pages/flashcard.html?book=${book.book_key}&unit=${item.unit}&source=${tableSource}`;
                        // آدرس بازی Speed Match
                        const gameUrl = `/pages/speedtest/speedtest.html?book=${book.book_key}&unit=${item.unit}&source=${tableSource}`;

                        const title = (lang === 'fa') ? (item.titleFa || item.title_fa || item.titleEn) : (item.titleEn || item.title_en);
                        const desc = (lang === 'fa') ? (item.descFa || item.desc_fa || item.descEn) : (item.descEn || item.desc_en);
                        const textDirection = (lang === 'fa') ? 'style="direction: rtl; text-align: right;"' : 'style="direction: ltr; text-align: left;"';

                        const unitRow = document.createElement("div");
                        unitRow.className = "unit-row-item";

                        unitRow.innerHTML = `
                        <a href="${flashcardUrl}" class="unit-left-link" ${item.requireAuth ? 'data-require-auth="true"' : ''}>
                            <div class="unit-left" ${textDirection}>
                                <div class="unit-number-badge">${item.unit}</div>
                                <i class="${item.icon || 'fa-solid fa-book'} unit-icon"></i>
                                <div class="unit-details">
                                    <h4>${title}</h4>
                                    <p>${desc}</p>
                                </div>
                            </div>
                        </a>
                        <div class="unit-actions">
                            <a href="${gameUrl}" class="game-btn-icon" title="Speed Match Game" ${item.requireAuth ? 'data-require-auth="true"' : ''}>
                                <i class="fa-solid fa-gamepad"></i>
                            </a>
                            <a href="${flashcardUrl}" class="unit-arrow-link" ${item.requireAuth ? 'data-require-auth="true"' : ''}>
                                <i class="fa-solid fa-chevron-right unit-arrow"></i>
                            </a>
                        </div>
                    `;

                        targetContainer.appendChild(unitRow);
                    });
                }
            });

            if (typeof updateLinksStyle === 'function') {
                updateLinksStyle();
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            loadBooksAndRenderUnits();
        });

        window.addEventListener('languageChanged', function (e) {
            if (cachedBooksData) {
                renderBooksAndUnits(cachedBooksData);
            }
        });
    </script>
    <script type="module" src="/assets/JS/auth.js"></script>
    <script type="module" src="/assets/JS/auth-guard.js"></script>
</body>
