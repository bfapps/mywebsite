<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESl Island Pro Flashcards & Quizzes</title>
    <meta name="referrer" content="no-referrer">
    <!-- Font Awesome for sleek professional icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter (English) & Vazirmatn (Persian) -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Vazirmatn:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet"
        type="text/css" />
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/shabnam-font@v5.0.1/dist/font-face.css" rel="stylesheet"
        type="text/css" />
    <link rel="stylesheet" href="/global.css">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Force fontawesome to keep its own font family in Persian mode */
        html[lang="fa"] .fa-solid,
        html[lang="fa"] .fa-regular,
        html[lang="fa"] i {
            font-family: "Font Awesome 6 Free" !important;
        }

        html[lang="fa"] .util-btn {
            font-size: 11px;
            font-weight: 600;
        }

        html[lang="fa"] .stat-label {
            font-size: 11px;
            font-weight: 600;
        }

        html[lang="fa"] .analytics-title {
            font-size: 13px;
        }

        html[lang="fa"] .feature-btn {
            font-size: 11px;
            font-weight: 500;
        }

        html[lang="fa"] .eval-btn {
            font-size: 12px;
            font-weight: 600;
        }

        html[lang="fa"] .nav-btn {
            font-size: 13px;
            font-weight: 600;
        }

        html[lang="fa"] .quiz-choice-btn {
            font-size: 13px;
            font-weight: 500;
        }

        html[lang="fa"] .dynamic-hint-area {
            font-size: 12.5px;
            font-weight: 500;
        }

        html[lang="fa"] footer {
            font-size: 12px;
        }

        /* RTL Handling for specific elements */
        html[dir="rtl"] .progress-text {
            text-align: left;
        }

        html[dir="rtl"] .analytics-title span i {
            margin-right: 0;
            margin-left: 4px;
        }

        /* Keeps Prev on Left and Next on Right in Persian, identical to English 
        html[dir="rtl"] .navigation-row {
            flex-direction: row-reverse;
        } */
        [lang="fa"] .navigation-row .fa-solid {
            transform: rotate(180deg);
            transition: transform 0.3s ease;
            /* برای نرم‌تر شدن انیمیشن هنگام تغییر زبان */
        }

        .container {
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        header {
            flex-wrap: wrap;
            gap: 12px;
        }

        /* ==========================================================================
            FOOTER
            ========================================================================== */
        footer {
            margin-top: auto;
            padding: 24px 0;
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
        }

        /* ==========================================================================
            FLASHCARDS
            ========================================================================== */
        .flashcard-wrapper {
            background: #ffffff;
            border-radius: 24px;
            border: 1px solid var(--border-color);
            padding: 24px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.04);
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin: 20px 0;
        }

        /* Progress Bar */
        .progress-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 0 4px;
        }

        .progress-bar-bg {
            flex: 1;
            height: 8px;
            background-color: var(--border-color);
            border-radius: 99px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #3b82f6, var(--blue));
            border-radius: 99px;
            transition: width 0.3s ease;
        }

        .progress-text {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-muted);
            min-width: 48px;
            text-align: right;
        }

        /* Fluid Utilities Tool Bar Grid (Responsive Auto-Fill Layout) */
        .utilities-bar {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 10px;
            padding: 4px 0;
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 14px;
        }

        .util-btn {
            background: #ffffff;
            border: 1px solid var(--border-color);
            padding: 10px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .util-btn:hover {
            background: var(--gray-btn-hover);
            color: var(--text-dark);
        }

        .util-btn.active {
            background: var(--blue-light);
            border-color: rgba(29, 78, 216, 0.2);
            color: var(--blue);
        }

        .util-btn.quiz-trigger {
            background: var(--bg-page);
            color: var(--text-dark);
            border-color: var(--border-color);
        }

        .util-btn.quiz-trigger:hover {
            background: var(--blue-light);
            border-color: var(--blue);
            color: var(--blue);
        }

        /* --- ANALYTICS DASHBOARD PANEL --- */
        .analytics-panel {
            display: none;
            background: #fafafa;
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            flex-direction: column;
            gap: 14px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .analytics-title {
            font-size: 14px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
        }

        .stat-row {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .stat-label {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            font-weight: 700;
        }

        .stat-bar-bg {
            height: 8px;
            background: var(--border-color);
            border-radius: 99px;
            overflow: hidden;
        }

        .stat-bar-fill {
            height: 100%;
            border-radius: 99px;
            width: 0%;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* 3D Box architecture */
        .display-box {
            width: 100%;
            min-height: 290px;
            position: relative;
            touch-action: pan-y;
        }

        .display-box.flashcard-perspective {
            perspective: 1000px;
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            padding: 0 !important;
        }

        .display-box.quiz-style {
            background-color: var(--bg-page);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 32px 24px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 14px;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            min-height: 290px;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .display-box.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-front,
        .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            min-height: 290px;
            top: 0;
            left: 0;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 14px;
        }

        .card-front {
            background-color: var(--bg-page);
            color: var(--text-dark);
        }

        .card-back {
            background-color: #ffffff;
            color: var(--text-dark);
            transform: rotateY(180deg);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.02);
        }

        .word-header-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            position: relative;
        }

        .word-title {
            font-size: 24px;
            font-weight: 800;
            color: var(--text-dark);
            letter-spacing: -0.5px;
            direction: ltr;
        }

        html[lang="fa"] .word-title {
            font-size: 21px;
        }

        .star-icon {
            font-size: 22px;
            color: var(--border-color);
            cursor: pointer;
            transition: transform 0.2s ease, color 0.2s ease;
        }

        .star-icon.starred {
            color: var(--star-color);
            animation: pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes pop {
            50% {
                transform: scale(1.3);
            }

            100% {
                transform: scale(1);
            }
        }

        .sentence-example {
            font-size: 15px;
            color: var(--text-muted);
            line-height: 1.5;
            max-width: 440px;
            font-style: italic;
            direction: ltr;
        }

        html[lang="fa"] .sentence-example {
            font-size: 14px;
        }

        .dynamic-hint-area {
            font-size: 14px;
            font-weight: 600;
            color: var(--blue);
            background: var(--blue-light);
            padding: 8px 14px;
            border-radius: 20px;
            margin-top: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .quiz-choices-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 8px;
        }

        .quiz-choice-btn {
            width: 100%;
            padding: 12px;
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
        }

        .quiz-choice-btn.fa-lang-dir {
            direction: rtl;
        }

        .quiz-choice-btn.en-lang-dir {
            direction: ltr;
        }

        .quiz-choice-btn:hover {
            background: var(--gray-btn-hover);
        }

        .quiz-choice-btn.correct {
            background-color: #d1fae5;
            border-color: var(--green);
            color: #065f46;
        }

        .quiz-choice-btn.wrong {
            background-color: #fee2e2;
            border-color: var(--red);
            color: #991b1b;
        }

        .features-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .feature-btn {
            background-color: var(--gray-btn);
            border: 1px solid transparent;
            color: var(--text-dark);
            padding: 12px 6px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .feature-btn i {
            font-size: 14px;
            color: var(--text-muted);
        }

        .feature-btn:hover {
            background-color: var(--gray-btn-hover);
        }

        .feature-btn.active {
            background-color: var(--blue-light);
            border-color: rgba(29, 78, 216, 0.2);
            color: var(--blue);
        }

        .feature-btn.active i {
            color: var(--blue);
        }

        .feature-btn.disabled,
        .feature-btn:disabled {
            opacity: 0.35;
            background-color: #f1f5f9 !important;
            color: #94a3b8 !important;
            border-color: #e2e8f0 !important;
            cursor: not-allowed !important;
            pointer-events: none;
        }

        .evaluation-row {
            display: flex;
            flex-direction: row;
            gap: 8px;
            margin-top: 4px;
            background: var(--bg-page);
            padding: 8px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
        }

        .eval-btn {
            flex: 1;
            padding: 12px 4px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            border: 1px solid var(--border-color);
            background: #ffffff;
            transition: all 0.2s ease;
        }

        .eval-btn.hard:hover,
        .eval-btn.hard.active {
            background-color: var(--red-light);
            border-color: var(--red);
            color: #991b1b;
        }

        .eval-btn.medium:hover,
        .eval-btn.medium.active {
            background-color: var(--yellow-light);
            border-color: var(--star-color);
            color: var(--yellow-dark);
        }

        .eval-btn.easy:hover,
        .eval-btn.easy.active {
            background-color: var(--green-light);
            border-color: var(--green);
            color: #065f46;
        }

        .navigation-row {
            display: flex;
            gap: 12px;
            margin-top: 2px;
        }

        .nav-btn {
            flex: 1;
            padding: 14px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
            user-select: none;
            -webkit-user-select: none;
        }

        .nav-btn.next {
            background-color: var(--blue);
            color: #ffffff;
            border: none;
            box-shadow: 0 4px 12px rgba(29, 78, 216, 0.15);
        }

        .nav-btn.next:hover {
            background-color: var(--blue-hover);
            transform: translateY(-1px);
        }

        .nav-btn.prev {
            background-color: #ffffff;
            color: var(--text-dark);
            border: 1px solid var(--border-color);
        }

        .nav-btn.prev:hover {
            background-color: var(--bg-page);
        }

        .nav-btn.prev.disabled,
        .nav-btn.prev:disabled {
            opacity: 0.4;
            cursor: not-allowed !important;
            pointer-events: none;
        }

        @media (max-width: 480px) {
            .flashcard-wrapper {
                padding: 16px;
                gap: 14px;
            }

            .display-box,
            .card-inner,
            .card-front,
            .card-back {
                min-height: 280px;
            }

            .card-front,
            .card-back {
                padding: 20px 16px;
            }

            .word-title {
                font-size: 20px;
            }

            html[lang="fa"] .word-title {
                font-size: 18px;
            }

            .features-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }

            .util-btn {
                font-size: 11px;
                padding: 8px 4px;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <header id="header">
            <!--injected by JS from global JS-->
        </header>
        <main class="flashcard-wrapper">

            <!-- Utilities Bar -->
            <div class="utilities-bar" id="utilitiesBar">
                
                <button class="util-btn" id="shuffleBtn" onclick="toggleShuffle()">
                    <i class="fa-solid fa-shuffle"></i> <span data-i18n="shuffle">Shuffle Order</span>
                </button>
                <button class="util-btn" id="autoPlayBtn" onclick="toggleAutoPlay()">
                    <i class="fa-solid fa-volume-low"></i> <span data-i18n="autoPlay">Auto Play</span>
                </button>
                <button class="util-btn" id="starredFilterBtn" onclick="toggleStarredFilter()">
                    <i class="fa-solid fa-star"></i> <span data-i18n="starredOnly">Starred Only</span>
                </button>
                <!-- 
                <button class="util-btn" id="weakFilterBtn" onclick="toggleWeakFilter()">
                    <i class="fa-solid fa-triangle-exclamation"></i> <span data-i18n="weakWords">Weak Words</span>
                </button>  -->
                
                <button class="util-btn" id="srsFilterBtn" onclick="toggleSRSFilter()">
                    <i class="fa-solid fa-boxes-stacked"></i> <span data-i18n="reviewTitle">Review</span>
                </button>
                <button class="util-btn" id="analyticsBtn" onclick="toggleAnalytics()">
                    <i class="fa-solid fa-chart-pie"></i> <span data-i18n="analytics">Analytics</span>
                </button>

                <!-- دکمه آزمون استاندارد و هم‌شکل با بقیه -->
                <button class="util-btn" id="quizMenuBtn" onclick="showQuizSelectionInCard()">
                    <i class="fa-solid fa-list-check"></i> <span data-i18n="quizzes">Quizzes</span>
                </button>
            </div>

            <!-- Dynamic Analytics Panel -->
            <div class="analytics-panel" id="analyticsPanel">
                <div class="analytics-title">
                    <span><i class="fa-solid fa-chart-simple" style="color:var(--blue);"></i> <span
                            data-i18n="analyticsTitle">Leitner Analytics Dashboard</span></span>
                    <div style="display: flex; align-items: center; gap: 12px;">
                        <span style="font-size:12px; color:var(--text-muted);"><span data-i18n="total">Total</span>:
                            <strong id="countTotal">0</strong></span>
                        <button class="util-btn" data-i18n="resetAll"
                            style="padding: 4px 8px; font-size: 11px; background-color: var(--red-light); color: var(--red); border-color: transparent;"
                            onclick="resetAllUnitData()">
                            <i class="fa-solid fa-trash-can"></i> Reset All
                        </button>
                    </div>
                </div>

                <div class="stat-row">
                    <div class="stat-label">
                        <span style="color:var(--green);"><i class="fa-solid fa-circle-check"></i> <span
                                data-i18n="mastered">Mastered (Knew It)</span></span>
                        <span id="barKnewText" style="color:var(--text-muted);">0 (0%)</span>
                    </div>
                    <div class="stat-bar-bg">
                        <div class="stat-bar-fill" id="barKnewFill" style="background:var(--green)"></div>
                    </div>
                </div>

                <div class="stat-row">
                    <div class="stat-label">
                        <span style="color:var(--star-color);"><i class="fa-solid fa-circle-minus"></i> <span
                                data-i18n="learning">Learning (Not Sure)</span></span>
                        <span id="barNotSureText" style="color:var(--text-muted);">0 (0%)</span>
                    </div>
                    <div class="stat-bar-bg">
                        <div class="stat-bar-fill" id="barNotSureFill" style="background:var(--star-color)"></div>
                    </div>
                </div>

                <div class="stat-row">
                    <div class="stat-label">
                        <span style="color:var(--red);"><i class="fa-solid fa-circle-xmark"></i> <span
                                data-i18n="struggling">Struggling (Forgot)</span></span>
                        <span id="barForgotText" style="color:var(--text-muted);">0 (0%)</span>
                    </div>
                    <div class="stat-bar-bg">
                        <div class="stat-bar-fill" id="barForgotFill" style="background:var(--red)"></div>
                    </div>
                </div>

                <div class="stat-row">
                    <div class="stat-label">
                        <span style="color:var(--text-muted);"><i class="fa-solid fa-circle-question"></i> <span
                                data-i18n="unreviewed">Unreviewed</span></span>
                        <span id="barUnreviewedText" style="color:var(--text-muted);">0 (0%)</span>
                    </div>
                    <div class="stat-bar-bg">
                        <div class="stat-bar-fill" id="barUnreviewedFill" style="background:var(--text-muted)"></div>
                    </div>
                </div>
            </div>

            <!-- Asking Type of the Tests -->
            <div id="quizSelectionContainer"
                style="display: none; text-align: center; padding: 24px; background-color: var(--bg-page); border: 1px solid var(--border-color); border-radius: 16px; min-height: 290px; justify-content: center; flex-direction: column; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.02);">
                <h3 style="margin-bottom: 20px; color: var(--text-dark); font-weight: 800; font-size: 16px;"
                    data-i18n="chooseQuizType">Choose Quiz Type</h3>
                <div
                    style="display: flex; flex-direction: column; gap: 10px; max-width: 250px; margin: 0 auto; width: 100%;">
                    <button class="quiz-choice-btn" onclick="selectQuizMode('meaning')"
                        style="padding: 12px; cursor: pointer;" aria-label="Meaning Quiz"
                        data-i18n="meaningQuiz">Meaning Quiz</button>
                    <button class="quiz-choice-btn" onclick="selectQuizMode('listening')"
                        style="padding: 12px; cursor: pointer;" aria-label="Listening Quiz"
                        data-i18n="listeningQuiz">Listening Quiz</button>
                    <button class="quiz-choice-btn" onclick="selectQuizMode('spelling')"
                        style="padding: 12px; cursor: pointer;" aria-label="Spelling Quiz"
                        data-i18n="spellingQuiz">Spelling Quiz</button>
                    <button class="quiz-choice-btn" onclick="cancelQuizSelection()"
                        style="padding: 10px; cursor: pointer; background-color: var(--gray-btn); color: var(--text-dark); border-color: transparent;"
                        aria-label="Cancel Quiz" data-i18n="exitQuiz">Cancel</button>
                </div>
            </div>

            <!-- Interactive 3D Display Box -->
            <div class="display-box" id="displayBox">
                <!-- Content injected dynamically by JS -->
            </div>

            <!-- Progress Elements -->
            <div class="progress-container">
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="progressBarFill"></div>
                </div>
                <div class="progress-text" id="progressText">0 / 0</div>
            </div>

            <!-- Context Hint Grid -->
            <div class="features-grid" id="featuresGrid">
                <button class="feature-btn" onclick="toggleHint('meaning', this)">
                    <i class="fa-solid fa-language"></i> <span data-i18n="featMeaning">Meaning</span>
                </button>
                <button class="feature-btn" onclick="toggleHint('pronunciation', this)">
                    <i class="fa-solid fa-volume-high"></i> <span data-i18n="featSounds">Sounds</span>
                </button>
                <button class="feature-btn" onclick="toggleHint('type', this)">
                    <i class="fa-solid fa-tags"></i> <span data-i18n="featType">Type</span>
                </button>
                <button class="feature-btn" id="imageFeatureBtn" onclick="toggleHint('image', this)">
                    <i class="fa-solid fa-image"></i> <span data-i18n="featImage">Image</span>
                </button>
            </div>

            <!-- Leitner Evaluation Bar -->
            <div class="evaluation-row" id="evaluationRow">
                <button class="eval-btn hard" id="btnHard" onclick="gradeWord('hard')">
                    <span data-i18n="badgeForgot"> Forgot</span>
                </button>
                <button class="eval-btn medium" id="btnMedium" onclick="gradeWord('medium')">
                    <span data-i18n="badgeNotSure"> Not Sure</span>
                </button>
                <button class="eval-btn easy" id="btnEasy" onclick="gradeWord('easy')">
                    <span data-i18n="badgeKnew"> Knew It </span>
                </button>
            </div>

            <!-- Actions Row -->
            <div class="navigation-row" id="navigationRow">
                <button class="nav-btn prev" id="prevBtn" onclick="navigateCard(-1)"> <span data-i18n="prev"> Previous
                    </span>
                </button>
                <button class="nav-btn next" id="nextBtn" onclick="navigateCard(1)"> <span data-i18n="next"> Next
                    </span>
                </button>
            </div>

        </main>

        <footer id="footer">
            <!--injected by JS from global JS-->
        </footer>
    </div>
    <audio id="globalAudioPlayer" style="display: none;"></audio>
    <script>
        window.PAGE_NAME = 'flashcard'; // تعیین نام صفحه برای دریافت ترجمه‌های اختصاصی
    </script>
    <script src="/global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="/assets/JS/auth.js"></script>
    <script type="module" src="/assets/JS/auth-guard.js"></script>
    <script type="module" src="/assets/JS/auth-lock.js"></script>

    <script type="module" src="/assets/JS/wordlist-progress.js"></script>

    <script>
        /* ==========================================================================
               تنظیم افکت‌های صوتی سیستم
            ========================================================================== */
        const sounds = {
            correct: new Audio('/assets/audio/quiz/correct.mp3'),
            wrong: new Audio('/assets/audio/quiz/wrong.mp3'),
            cheer: new Audio('/assets/audio/quiz/cheer.mp3'),
            fail: new Audio('/assets/audio/quiz/fail.mp3'),
            cardSlide: new Audio('/assets/audio/quiz/swipe.mp3') // افکت تعویض کارت
        };

        function playSfx(soundKey) {
            if (sounds[soundKey]) {
                sounds[soundKey].currentTime = 0;
                sounds[soundKey].play().catch(err => {
                    console.warn("پخش افکت صوتی متوقف شد:", err);
                });
            }
        }

        /* --- ۱. تنظیمات و متغیرهای سراسری سیستم --- */
        const urlParams = new URLSearchParams(window.location.search);
        const selectedBook = urlParams.get('book'); // اسم لیست/کتاب
        const selectedUnit = urlParams.get('unit') || '1'; // شماره یونیت

        const selectedUnitKey = `${selectedBook}_u${selectedUnit}`;

        let masterDataset = [];
        let workingDataset = [];
        let currentIndex = 0;
        let currentAudioObject = null;

        let isSRSFilterActive = false;
        let isShuffleActive = false;
        let isAutoPlayActive = false;
        let isStarredFilterActive = false;
        let isWeakFilterActive = false;
        let isAnalyticsOpen = false;

        let isQuizMode = false;
        let activeQuizType = 'meaning';
        let quizScore = 0;
        let quizStep = 0;
        let quizQuestions = [];

        // ==========================================
        // دریافت کلمات از Supabase و راه اندازی کارت‌ها
        // ==========================================
        document.addEventListener('DOMContentLoaded', async () => {
            initSwipeGestures();

            if (!selectedBook) {
                alert("عنوان لیست مشخص نشده است.");
                return;
            }

            const listSource = urlParams.get('source') || 'user_lists';

            try {
                const { data: { user } } = await window.supabase.auth.getUser();
                if (!user) {
                    alert("برای دسترسی به این لیست ابتدا باید وارد شوید.");
                    window.location.href = '/pages/auth.html';
                    return;
                }

                let query = window.supabase
                    .from(listSource)
                    .select('words')
                    .eq('title', decodeURIComponent(selectedBook));

                if (listSource !== 'community_lists') {
                    query = query.eq('user_id', user.id);
                } else {
                    query = query.eq('is_approved', true);
                }

                const { data, error } = await query.maybeSingle();

                if (error || !data || !data.words || data.words.length === 0) {
                    console.error("Fetch Error:", error);
                    alert("لیست مورد نظر یافت نشد یا خالی است.");
                    return;
                }

                initFlashcards(data.words);

            } catch (err) {
                console.error("Error loading flashcards:", err);
            }
        });

        function initFlashcards(words) {
            masterDataset = words.map((w, index) => ({
                id: w.id || index + 1,
                name: w.name || w.word || '',
                meaning: w.meaning || '',
                example: w.example || '',
                pronunciation: w.pronunciation || '',
                type: w.type || 'Word',
                image: w.image || '',
                audio: w.audio || `https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=en&q=${encodeURIComponent(w.name || w.word || '')}`
            }));

            workingDataset = [...masterDataset];

            isAutoPlayActive = localStorage.getItem(`autoplay_${selectedUnitKey}`) === 'true';

            if (window.getUnitProgress) {
                window.getUnitProgress(selectedBook, selectedUnit).then(dbData => {
                    if (dbData) {
                        if (dbData.starred_words) localStorage.setItem(`starred_words_${selectedUnitKey}`, JSON.stringify(dbData.starred_words));
                        if (dbData.words_status) localStorage.setItem(`words_status_${selectedUnitKey}`, JSON.stringify(dbData.words_status));
                        if (dbData.word_notes) localStorage.setItem(`word_notes_${selectedUnitKey}`, JSON.stringify(dbData.word_notes));

                        if (dbData.last_card_index !== undefined && dbData.last_card_index < workingDataset.length) {
                            currentIndex = dbData.last_card_index;
                            localStorage.setItem(`saved_progress_${selectedUnitKey}`, currentIndex);
                        }

                        if (dbData.is_autoplay !== undefined && dbData.is_autoplay !== null) {
                            isAutoPlayActive = dbData.is_autoplay;
                            localStorage.setItem(`autoplay_${selectedUnitKey}`, isAutoPlayActive);
                        }
                    }
                    updateAutoPlayUI();
                    applyFilters();
                }).catch(err => {
                    console.error("خطا در دریافت اطلاعات از Supabase:", err);
                    updateAutoPlayUI();
                    applyFilters();
                });
            } else {
                updateAutoPlayUI();
                applyFilters();
            }
        }

        function updateAutoPlayUI() {
            const autoPlayBtn = document.getElementById('autoPlayBtn');
            if (autoPlayBtn) {
                autoPlayBtn.classList.toggle('active', isAutoPlayActive);
            }
        }

        /* --- مدیریت کلیدهای حافظه و وضعیت لایتنر کلمات --- */
        function getStarredList() {
            return JSON.parse(localStorage.getItem(`starred_words_${selectedUnitKey}`)) || [];
        }

        function getWordsStatus() {
            return JSON.parse(localStorage.getItem(`words_status_${selectedUnitKey}`)) || {};
        }

        function setWordStatus(wordId, status) {
            let statusList = getWordsStatus();
            if (status === '') {
                delete statusList[wordId];
            } else {
                statusList[wordId] = status;
            }
            localStorage.setItem(`words_status_${selectedUnitKey}`, JSON.stringify(statusList));
            if (window.updateWordStatus) {
                window.updateWordStatus(selectedBook, selectedUnit, wordId, status);
            }
            if (isAnalyticsOpen) renderAnalytics();
        }

        function getWordNotesList() {
            return JSON.parse(localStorage.getItem(`word_notes_${selectedUnitKey}`)) || {};
        }

        function getWordNote(wordId) {
            return getWordNotesList()[wordId] || '';
        }

        function saveWordNote(wordId, value) {
            let notes = getWordNotesList();
            if (value.trim() === '') {
                delete notes[wordId];
            } else {
                notes[wordId] = value;
            }
            localStorage.setItem(`word_notes_${selectedUnitKey}`, JSON.stringify(notes));
            if (window.updateWordNote) {
                window.updateWordNote(selectedBook, selectedUnit, wordId, value);
            }
        }

        function resetAllUnitData() {
            if (confirm(translations[currentLang].confirmReset)) {
                localStorage.removeItem(`starred_words_${selectedUnitKey}`);
                localStorage.removeItem(`words_status_${selectedUnitKey}`);
                localStorage.removeItem(`saved_progress_${selectedUnitKey}`);
                localStorage.removeItem(`autoplay_${selectedUnitKey}`);

                if (window.resetUnitDataInSupabase) {
                    window.resetUnitDataInSupabase(selectedBook, selectedUnit);
                }

                isSRSFilterActive = false;
                isShuffleActive = false;
                isAutoPlayActive = false;
                isStarredFilterActive = false;
                isWeakFilterActive = false;

                document.getElementById('srsFilterBtn')?.classList.remove('active');
                document.getElementById('shuffleBtn')?.classList.remove('active');
                document.getElementById('autoPlayBtn')?.classList.remove('active');
                document.getElementById('starredFilterBtn')?.classList.remove('active');
                document.getElementById('weakFilterBtn')?.classList.remove('active');

                applyFilters();
                if (isAnalyticsOpen) renderAnalytics();
            }
        }

        function toggleAutoPlay() {
            isAutoPlayActive = !isAutoPlayActive;
            localStorage.setItem(`autoplay_${selectedUnitKey}`, isAutoPlayActive);

            if (window.updateAutoPlayStatus) {
                window.updateAutoPlayStatus(selectedBook, selectedUnit, isAutoPlayActive);
            }

            updateAutoPlayUI();

            if (isAutoPlayActive && workingDataset[currentIndex] && workingDataset[currentIndex].audio) {
                playRealAudio(workingDataset[currentIndex].audio);
            }
        }

        /* --- داشبورد آمار تحلیلی لایتنر --- */
        function toggleAnalytics() {
            const panel = document.getElementById('analyticsPanel');
            isAnalyticsOpen = !isAnalyticsOpen;
            document.getElementById('analyticsBtn').classList.toggle('active', isAnalyticsOpen);
            if (isAnalyticsOpen) {
                panel.style.display = 'flex';
                renderAnalytics();
            } else {
                panel.style.display = 'none';
            }
        }

        function renderAnalytics() {
            const total = masterDataset.length;
            const statusList = getWordsStatus();

            let countForgot = 0, countNotSure = 0, countKnew = 0, countUnreviewed = 0;

            masterDataset.forEach(word => {
                const status = statusList[word.id];
                if (status === 'hard') countForgot++;
                else if (status === 'medium') countNotSure++;
                else if (status === 'easy') countKnew++;
                else countUnreviewed++;
            });

            const pctForgot = total > 0 ? Math.round((countForgot / total) * 100) : 0;
            const pctNotSure = total > 0 ? Math.round((countNotSure / total) * 100) : 0;
            const pctKnew = total > 0 ? Math.round((countKnew / total) * 100) : 0;
            const pctUnreviewed = total > 0 ? Math.round((countUnreviewed / total) * 100) : 0;

            document.getElementById('countTotal').innerText = total;

            updateStatBar('barKnew', countKnew, pctKnew);
            updateStatBar('barNotSure', countNotSure, pctNotSure);
            updateStatBar('barForgot', countForgot, pctForgot);
            updateStatBar('barUnreviewed', countUnreviewed, pctUnreviewed);
        }

        function updateStatBar(idPrefix, count, percent) {
            document.getElementById(`${idPrefix}Text`).innerText = `${count} (${percent}%)`;
            document.getElementById(`${idPrefix}Fill`).style.width = `${percent}%`;
        }

        /* --- رندر کردن و نمایش کارت‌ها --- */
        function renderCard() {
            isQuizMode = false;
            const dict = translations[currentLang] || translations['en'];
            hideQuizSelection();

            const cardContent = document.getElementById('cardContent') || document.querySelector('.card-body');
            const cardNavButtons = document.getElementById('cardNavButtons') || document.querySelector('.card-navigation');
            if (cardContent) cardContent.style.display = 'block';
            if (cardNavButtons) cardNavButtons.style.display = 'flex';

            document.getElementById('featuresGrid').style.display = 'grid';
            document.getElementById('navigationRow').style.display = 'flex';
            document.getElementById('utilitiesBar').style.display = 'grid';
            document.getElementById('evaluationRow').style.display = 'flex';

            document.querySelectorAll('.feature-btn').forEach(btn => btn.classList.remove('active'));

            const displayBox = document.getElementById('displayBox');
            const imageBtn = document.getElementById('imageFeatureBtn');

            displayBox.classList.remove('quiz-style', 'flipped');
            displayBox.classList.add('flashcard-perspective');

            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');

            prevBtn.innerHTML = `<i class="fa-solid fa-arrow-left"></i> <span>${dict.prev}</span>`;
            nextBtn.innerHTML = `<span>${dict.next}</span> <i class="fa-solid fa-arrow-right"></i>`;

            if (workingDataset.length === 0) {
                displayBox.classList.remove('flashcard-perspective');
                displayBox.classList.add('quiz-style');
                displayBox.innerHTML = `
                        <i class="fa-solid fa-folder-open" style="font-size: 40px; color: var(--text-muted);"></i>
                        <div class="word-title" style="font-size: 16px; margin-top:10px; direction:initial;">${dict.noMatches}</div>
                        <p class="sentence-example" style="direction:initial; margin: 4px auto;">${dict.noMatchesSub}</p>
                    `;
                updateProgressBar(0, 0);
                prevBtn.disabled = true;
                prevBtn.classList.add('disabled');
                document.getElementById('evaluationRow').style.display = 'none';
                if (imageBtn) { imageBtn.disabled = true; imageBtn.classList.add('disabled'); }
                return;
            }

            const currentWord = workingDataset[currentIndex];
            if (!currentWord) return;

            const starredList = getStarredList();
            const isStarred = starredList.includes(currentWord.id);

            const statusList = getWordsStatus();
            const currentStatus = statusList[currentWord.id] || '';

            let statusBadge = '';
            const badgeOffsetStyle = currentLang === 'fa' ? 'left:16px;' : 'right:16px;';
            if (currentStatus === 'hard') statusBadge = `<span style="position:absolute; ${badgeOffsetStyle} top:16px; font-size:10px; padding:2px 8px; background:var(--red-light); color:#ef4444; border-radius:12px; font-weight:700;">${dict.badgeForgot}</span>`;
            if (currentStatus === 'medium') statusBadge = `<span style="position:absolute; ${badgeOffsetStyle} top:16px; font-size:10px; padding:2px 8px; background:var(--yellow-light); color:var(--yellow-dark); border-radius:12px; font-weight:700;">${dict.badgeNotSure}</span>`;
            if (currentStatus === 'easy') statusBadge = `<span style="position:absolute; ${badgeOffsetStyle} top:16px; font-size:10px; padding:2px 8px; background:var(--green-light); color:#10b981; border-radius:12px; font-weight:700;">${dict.badgeKnew}</span>`;

            displayBox.innerHTML = `
                    <div class="card-inner">
                        <div class="card-front">
                            ${statusBadge}
                            <div class="word-header-row">
                                <div class="word-title" id="wordTitle">${currentWord.name}</div>
                                <i class="fa-star ${isStarred ? 'fa-solid starred' : 'fa-regular'} star-icon" onclick="toggleStar(${currentWord.id}); event.stopPropagation();"></i>
                            </div>
                            <div class="sentence-example" id="wordExample">"${currentWord.example}"</div>
                            <div class="dynamic-hint-area">
                                <i class="fa-solid fa-circle-question" style="margin: 0 6px; opacity: 0.7; font-size: 12px;"></i> ${dict.tapClues}
                            </div>
                        </div>
                        <div class="card-back" id="cardBack"></div>
                    </div>
                `;

            document.getElementById('btnHard').classList.toggle('active', currentStatus === 'hard');
            document.getElementById('btnMedium').classList.toggle('active', currentStatus === 'medium');
            document.getElementById('btnEasy').classList.toggle('active', currentStatus === 'easy');

            if (imageBtn) {
                if (!currentWord.image || currentWord.image.trim() === "") {
                    imageBtn.disabled = true;
                    imageBtn.classList.add('disabled');
                } else {
                    imageBtn.disabled = false;
                    imageBtn.classList.remove('disabled');
                }
            }

            if (currentIndex === 0) {
                prevBtn.disabled = true;
                prevBtn.classList.add('disabled');
            } else {
                prevBtn.disabled = false;
                prevBtn.classList.remove('disabled');
            }

            updateProgressBar(currentIndex + 1, workingDataset.length);
            localStorage.setItem(`saved_progress_${selectedUnitKey}`, currentIndex);

            if (isAutoPlayActive && currentWord.audio) {
                setTimeout(() => {
                    if (!isQuizMode && workingDataset[currentIndex] && workingDataset[currentIndex].id === currentWord.id) {
                        playRealAudio(currentWord.audio);
                    }
                }, 400);
            }

            if (window.updateCardProgress) {
                window.updateCardProgress(selectedBook, selectedUnit, currentIndex);
            }
        }

        /* --- لمس و سوایپ --- */
        let touchstartX = 0;
        let touchendX = 0;

        function initSwipeGestures() {
            const displayBox = document.getElementById('displayBox');
            if (!displayBox) return;

            displayBox.addEventListener('touchstart', function (e) {
                if (e.target.tagName.toLowerCase() === 'textarea') return;
                touchstartX = e.changedTouches[0].screenX;
            }, { passive: true });

            displayBox.addEventListener('touchend', function (e) {
                if (e.target.tagName.toLowerCase() === 'textarea') return;
                touchendX = e.changedTouches[0].screenX;
                handleSwipe();
            }, { passive: true });
        }

        function handleSwipe() {
            if (isQuizMode || workingDataset.length === 0) return;
            const swipeThreshold = 60;
            const diff = touchendX - touchstartX;

            if (Math.abs(diff) < swipeThreshold) return;

            if (diff > 0) {
                currentLang === 'fa' ? navigateCard(1) : navigateCard(-1);
            } else {
                currentLang === 'fa' ? navigateCard(-1) : navigateCard(1);
            }
        }

        async function gradeWord(status) {
            if (workingDataset.length === 0 || isQuizMode) return;
            const currentWord = workingDataset[currentIndex];

            // ۱. آپدیت وضعیت کلمه در LocalStorage
            setWordStatus(currentWord.id, status);

            // ۲. ثبت هم‌زمان در Supabase (هم words_status و هم srs_data)
            if (window.updateWordProgressAndSRS) {
                await window.updateWordProgressAndSRS(selectedBook, selectedUnit, currentWord.id, status);
            }

            // ۳. به‌روزرسانی ظاهری دکمه‌های ارزیابی
            document.getElementById('btnHard')?.classList.toggle('active', status === 'hard');
            document.getElementById('btnMedium')?.classList.toggle('active', status === 'medium');
            document.getElementById('btnEasy')?.classList.toggle('active', status === 'easy');

            // ۴. در صورت فعال بودن فیلتر Weak Words یا SRS، اعمال مجدد فیلترها
            if (isWeakFilterActive || isSRSFilterActive) {
                setTimeout(() => { applyFilters(); }, 250);
            } else {
                setTimeout(() => { navigateCard(1); }, 250);
            }
        }

        function updateProgressBar(current, total) {
            const percent = total > 0 ? (current / total) * 100 : 0;
            document.getElementById('progressBarFill').style.width = `${percent}%`;
            document.getElementById('progressText').innerText = `${current} / ${total}`;
        }

        function navigateCard(direction) {
            if (currentAudioObject) currentAudioObject.pause();
            if (direction === -1 && currentIndex === 0) return;
            playSfx('cardSlide');
            currentIndex += direction;
            if (currentIndex >= workingDataset.length) {
                showCompletionScreen();
            } else {
                renderCard();
            }
        }

        function toggleStar(wordId) {
            let starredList = getStarredList();
            const isStarredCurrently = starredList.includes(wordId);

            if (isStarredCurrently) {
                starredList = starredList.filter(id => id !== wordId);
            } else {
                starredList.push(wordId);
            }
            localStorage.setItem(`starred_words_${selectedUnitKey}`, JSON.stringify(starredList));

            if (window.toggleStarredWord) {
                window.toggleStarredWord(selectedBook, selectedUnit, wordId);
            }

            if (!isStarredFilterActive) {
                const starIcon = document.querySelector('.star-icon');
                if (starIcon) {
                    if (!isStarredCurrently) {
                        starIcon.classList.remove('fa-regular');
                        starIcon.classList.add('fa-solid', 'starred');
                    } else {
                        starIcon.classList.remove('fa-solid', 'starred');
                        starIcon.classList.add('fa-regular');
                    }
                }
            } else {
                applyFilters();
            }
        }

        function toggleSRSFilter() {
            isSRSFilterActive = !isSRSFilterActive;
            document.getElementById('srsFilterBtn')?.classList.toggle('active', isSRSFilterActive);
            applyFilters();
        }

        function toggleShuffle() {
            isShuffleActive = !isShuffleActive;
            document.getElementById('shuffleBtn').classList.toggle('active', isShuffleActive);
            applyFilters();
        }

        function toggleStarredFilter() {
            isStarredFilterActive = !isStarredFilterActive;
            document.getElementById('starredFilterBtn').classList.toggle('active', isStarredFilterActive);
            applyFilters();
        }

        function toggleWeakFilter() {
            isWeakFilterActive = !isWeakFilterActive;
            document.getElementById('weakFilterBtn').classList.toggle('active', isWeakFilterActive);
            applyFilters();
        }

        async function applyFilters() {
            let base = [...masterDataset];

            // دریافت اطلاعات پروگرس و SRS
            const statusList = getWordsStatus();
            const currentUnitData = (window.getUnitProgress ? await window.getUnitProgress(selectedBook, selectedUnit) : null) || {};
            window.lastFetchedUnitData = currentUnitData;

            const srsData = currentUnitData?.srs_data || {};
            const dbStatuses = currentUnitData?.words_status || {};
            const mergedStatuses = { ...dbStatuses, ...statusList };
            const now = new Date().toISOString();

            // محاسبه تعداد کلمات موعد مرور (Due)
            const dueWordsCount = masterDataset.filter(w => {
                const wordSrs = srsData[w.id];
                return !wordSrs || !wordSrs.nextReviewAt || wordSrs.nextReviewAt <= now;
            }).length;

            // آپدیت لیبل دکمه همراه با Badge
            const srsBtn = document.getElementById('srsFilterBtn');
            if (srsBtn) {
                let reviewBtnText = (typeof currentLang !== 'undefined' && currentLang === 'fa') ? 'مرور' : 'Review';
                srsBtn.innerHTML = `
                    <i class="fa-solid fa-boxes-stacked"></i> <span data-i18n="reviewTitle">${reviewBtnText}</span>
                    <span style="background-color: var(--red, #ef4444); color: white; border-radius: 10px; padding: 2px 7px; font-size: 11px; font-weight: 800; margin-left: 4px;">${dueWordsCount}</span>
                `;
            }

            // ۱. فیلتر کلمات ضعیف (Weak Words)
            if (isWeakFilterActive) {
                base = base.filter(w => mergedStatuses[w.id] === 'hard' || mergedStatuses[w.id] === 'medium');
            }

            // ۲. فیلتر لایتنر (Due Review)
            if (isSRSFilterActive) {
                base = base.filter(w => {
                    const wordSrs = srsData[w.id];
                    return !wordSrs || !wordSrs.nextReviewAt || wordSrs.nextReviewAt <= now;
                });
            }

            // ۳. فیلتر ستاره‌دارها (Starred)
            if (isStarredFilterActive) {
                const starredList = getStarredList();
                base = base.filter(w => starredList.includes(w.id));
            }

            // ۴. برزدن (Shuffle)
            if (isShuffleActive) {
                base.sort(() => Math.random() - 0.5);
            }

            workingDataset = base;
            currentIndex = 0;

            renderCard();
        }

        function playRealAudio(audioPath, wordText) {
            if (!audioPath) return;

            if (currentAudioObject) {
                currentAudioObject.pause();
                currentAudioObject.removeAttribute('src');
                currentAudioObject.load();
            }

            const playFallbackTTS = () => {
                try {
                    let textToSpeak = wordText;

                    if (!textToSpeak && typeof audioPath === 'string') {
                        if (audioPath.includes('translate.google.com')) {
                            const urlObj = new URL(audioPath);
                            textToSpeak = urlObj.searchParams.get('q');
                        } else {
                            const fileName = audioPath.split('/').pop().split('.')[0];
                            textToSpeak = fileName.replace(/[-_]/g, ' ');
                        }
                    }

                    if (textToSpeak) {
                        window.speechSynthesis.cancel();
                        const utterance = new SpeechSynthesisUtterance(decodeURIComponent(textToSpeak));
                        utterance.lang = 'en-US';
                        utterance.rate = 0.9;
                        window.speechSynthesis.speak(utterance);
                    }
                } catch (e) {
                    console.log("خطا در سیستم صوتی:", e.message);
                }
            };

            currentAudioObject = document.createElement('audio');
            currentAudioObject.referrerPolicy = "no-referrer";
            currentAudioObject.src = audioPath;

            const playPromise = currentAudioObject.play();
            if (playPromise !== undefined) {
                playPromise.then(() => { }).catch(error => {
                    if (error.name === 'AbortError') return;
                    playFallbackTTS();
                });
            }
        }

        /* --- انیمیشن چرخش کارت --- */
        function toggleHint(type, element) {
            if (isQuizMode || workingDataset.length === 0) return;
            const displayBox = document.getElementById('displayBox');
            const cardBack = document.getElementById('cardBack');
            const currentWord = workingDataset[currentIndex];
            const isAlreadyActive = element.classList.contains('active');
            const dict = translations[currentLang] || translations['en'];

            document.querySelectorAll('.feature-btn').forEach(btn => btn.classList.remove('active'));

            if (isAlreadyActive) {
                displayBox.classList.remove('flipped');
            } else {
                element.classList.add('active');
                if (type === 'pronunciation') playRealAudio(currentWord.audio);

                let coreContent = '';

                if (type === 'image') {
                    coreContent = `
                            <img src="${currentWord.image}" alt="${currentWord.name}" style="max-height: 140px; max-width: 100%; border-radius: 10px; object-fit: contain;">
                            <div style="font-size: 13px; color: var(--text-muted); font-weight:600; direction:ltr; margin-top:2px;">${currentWord.name}</div>
                        `;
                } else if (type === 'pronunciation') {
                    coreContent = `
                            <i class="fa-solid fa-volume-high" style="font-size: 24px; color: var(--blue);"></i>
                            <div style="font-size: 18px; font-weight: 700; color: var(--text-dark); direction: ltr; margin: 4px 0;">${currentWord.pronunciation}</div>
                            <button class="util-btn" style="padding: 4px 12px; font-size:11px;" onclick="playRealAudio('${currentWord.audio}'); event.stopPropagation();">
                                <i class="fa-solid fa-rotate-right"></i> ${dict.listenAgain}
                            </button>
                        `;
                } else if (type === 'type') {
                    coreContent = `
                            <i class="fa-solid fa-tags" style="font-size: 24px; color: var(--blue);"></i>
                            <div style="font-size: 14px; font-weight: 700; color: var(--text-dark); background: var(--gray-btn); padding: 4px 14px; border-radius: 20px; direction: ltr; margin-top:5px;">${currentWord.type}</div>
                        `;
                } else if (type === 'meaning') {
                    coreContent = `
                            <i class="fa-solid fa-language" style="font-size: 28px; color: var(--blue);"></i>
                            <div style="font-size: 18px; font-weight: 700; color: var(--text-dark); margin-top:5px; direction:rtl;">${currentWord.meaning}</div>
                        `;
                }

                const notesBlockHTML = `
                        <div style="width:100%; margin-top:auto; padding-top:10px; border-top:1px dashed var(--border-color); display:flex; flex-direction:column; gap:4px;">
                            <label style="font-size:11px; font-weight:700; color:var(--text-muted); text-align:initial;"><i class="fa-regular fa-note-sticky"></i> ${dict.personalNotes}</label>
                            <textarea style="width:100%; height:44px; border:1px solid var(--border-color); border-radius:8px; background:var(--bg-page); color:var(--text-dark); font-size:12px; padding:6px; resize:none;" oninput="saveWordNote(${currentWord.id}, this.value)" onclick="event.stopPropagation();" placeholder="${dict.notesPlaceholder}">${getWordNote(currentWord.id)}</textarea>
                        </div>
                    `;

                cardBack.innerHTML = `<div style="display:flex; flex-direction:column; align-items:center; justify-content:center; width:100%; height:100%;">${coreContent} ${notesBlockHTML}</div>`;
                displayBox.classList.add('flipped');
            }
        }

        /* --- سیستم آزمون‌ها --- */
        function showQuizSelectionInCard() {
            const displayBox = document.getElementById('displayBox');
            if (displayBox) displayBox.style.display = 'none';

            hideInterfaceForQuiz();

            const selectionContainer = document.getElementById('quizSelectionContainer');
            if (selectionContainer) selectionContainer.style.display = 'flex';
        }

        function selectQuizMode(type) {
            hideQuizSelection();
            startQuizMode(type);
        }

        function cancelQuizSelection() {
            hideQuizSelection();

            const displayBox = document.getElementById('displayBox');
            if (displayBox) displayBox.style.display = 'block';

            renderCard();
        }

        function hideQuizSelection() {
            const selectionContainer = document.getElementById('quizSelectionContainer');
            if (selectionContainer) selectionContainer.style.display = 'none';
        }

        function showCompletionScreen() {
            isQuizMode = true;
            hideInterfaceForQuiz();
            const displayBox = document.getElementById('displayBox');
            const dict = translations[currentLang] || translations['en'];

            playSfx('cheer');

            displayBox.classList.remove('flashcard-perspective', 'flipped');
            displayBox.classList.add('quiz-style');

            displayBox.innerHTML = `
                    <i class="fa-solid fa-trophy" style="font-size: 48px; color: #f59e0b;"></i>
                    <div class="word-title" style="margin-top: 10px; direction:initial;">${dict.goodJob}</div>
                    <p class="sentence-example" style="direction:initial;">${dict.reviewedAll}</p>
                    <div class="quiz-choices-container" style="margin-top:15px;">
                        <button class="nav-btn next" onclick="startQuizMode('meaning')">${dict.meaningQuiz}</button>
                        <button class="nav-btn next" style="background-color:#8b5cf6;" onclick="startQuizMode('listening')">${dict.listeningQuiz}</button>
                        <button class="nav-btn prev" onclick="restartUnit()">${dict.reviewAgain}</button>
                        <button class="nav-btn next" style="background-color:#10b981;" onclick="startQuizMode('spelling')">${dict.spellingQuiz}</button>
                    </div>
                `;
        }

        function restartUnit() {
            currentIndex = 0;
            renderCard();
        }

        function hideInterfaceForQuiz() {
            document.getElementById('featuresGrid').style.display = 'none';
            document.getElementById('navigationRow').style.display = 'none';
            document.getElementById('utilitiesBar').style.display = 'none';
            document.getElementById('evaluationRow').style.display = 'none';
            document.getElementById('analyticsPanel').style.display = 'none';
        }

        function startQuizMode(quizType) {
            if (masterDataset.length < 2) {
                alert("کلمات کافی برای ساخت آزمون وجود ندارد!");
                return;
            }
            if (currentAudioObject) currentAudioObject.pause();

            isQuizMode = true;
            activeQuizType = quizType;
            quizScore = 0;
            quizStep = 0;

            hideInterfaceForQuiz();

            quizQuestions = [...masterDataset].sort(() => Math.random() - 0.5).slice(0, 5);
            generateQuizQuestion();
        }

        function generateQuizQuestion() {
            const displayBox = document.getElementById('displayBox');
            if (displayBox) displayBox.style.display = 'block';

            const currentQuestionWord = quizQuestions[quizStep];
            const dict = translations[currentLang] || translations['en'];

            displayBox.classList.remove('flashcard-perspective', 'flipped');
            displayBox.classList.add('quiz-style');
            updateProgressBar(quizStep + 1, quizQuestions.length);

            if (activeQuizType === 'meaning') {
                let choices = [currentQuestionWord.meaning];
                let wrongOptions = masterDataset.filter(w => w.id !== currentQuestionWord.id).map(w => w.meaning);
                wrongOptions.sort(() => Math.random() - 0.5);
                choices = choices.concat(wrongOptions.slice(0, 3)).sort(() => Math.random() - 0.5);

                displayBox.innerHTML = `
                        <div style="font-size:12px; font-weight:700; color:var(--blue); direction:initial;">${dict.meaningQuizTitle} • ${quizStep + 1}/${quizQuestions.length}</div>
                        <div class="word-title" style="margin-top:5px;">${currentQuestionWord.name}</div>
                        <p class="sentence-example" style="direction:initial; text-align:center; margin: auto auto;">${dict.whatIsMeaning}</p>
                        <div class="quiz-choices-container">
                            ${choices.map(choice => `<button class="quiz-choice-btn fa-lang-dir" onclick="handleQuizAnswer(this, '${choice}', '${currentQuestionWord.meaning}')">${choice}</button>`).join('')}
                        </div>
                        <button class="util-btn" style="margin-top: 14px; width:100%;" onclick="exitQuiz()"><i class="fa-solid fa-xmark"></i> ${dict.exitQuiz}</button>
                    `;
            } else if (activeQuizType === 'listening') {
                let choices = [currentQuestionWord.name];
                let wrongOptions = masterDataset.filter(w => w.id !== currentQuestionWord.id).map(w => w.name);
                wrongOptions.sort(() => Math.random() - 0.5);
                choices = choices.concat(wrongOptions.slice(0, 3)).sort(() => Math.random() - 0.5);

                displayBox.innerHTML = `
                        <div style="font-size:12px; font-weight:700; color:#8b5cf6; direction:initial;">${dict.listeningQuizTitle} • ${quizStep + 1}/${quizQuestions.length}</div>
                        <button class="nav-btn next" style="margin: 16px auto; max-width: 180px; background-color:#8b5cf6; box-shadow:none;" onclick="playRealAudio('${currentQuestionWord.audio}')">
                            <i class="fa-solid fa-volume-high"></i> ${dict.listenAgain}
                        </button>
                        <p class="sentence-example" style="direction:initial; text-align:center; margin: auto auto;">${dict.whichWordHear}</p>
                        <div class="quiz-choices-container">
                            ${choices.map(choice => `<button class="quiz-choice-btn en-lang-dir" onclick="handleQuizAnswer(this, '${choice}', '${currentQuestionWord.name}')">${choice}</button>`).join('')}
                        </div>
                        <button class="util-btn" style="margin-top: 14px; width:100%;" onclick="exitQuiz()"><i class="fa-solid fa-xmark"></i> ${dict.exitQuiz}</button>
                    `;

                setTimeout(() => { playRealAudio(currentQuestionWord.audio); }, 300);
            } else if (activeQuizType === 'spelling') {
                displayBox.innerHTML = `
                        <div style="font-size:12px; font-weight:700; color:#10b981; direction:initial;">${dict.spellingQuizTitle} • ${quizStep + 1}/${quizQuestions.length}</div>
                        <div style="font-size: 22px; font-weight: 800; color: var(--text-dark); margin: 10px 0; direction: rtl;">
                            ${currentQuestionWord.meaning}
                        </div>
                        <button class="nav-btn next" style="margin: 8px auto 16px auto; max-width: 180px; background-color:#10b981; box-shadow:none;" onclick="playRealAudio('${currentQuestionWord.audio}')">
                            <i class="fa-solid fa-volume-high"></i> ${dict.listenAgain}
                        </button>
                        <p class="sentence-example" style="direction:initial; font-size: 13px; text-align:center; margin: auto auto;">${dict.typeWhatYouHear}</p>
                        <div class="quiz-choices-container" style="gap:12px;">
                            <input type="text" id="spellingInput" class="quiz-choice-btn en-lang-dir" 
                                   placeholder="${dict.placeholderSpelling}" 
                                   style="text-align:center; cursor:text; background:#fff; direction: ltr;" 
                                   autocomplete="off" autofocus>
                            <button class="nav-btn next" id="spellingSubmitBtn" style="background-color:#0f172a;" onclick="checkSpellingAnswer()">
                                ${dict.checkSpelling}
                            </button>
                        </div>
                        <button class="util-btn" style="margin-top: 14px; width:100%;" onclick="exitQuiz()"><i class="fa-solid fa-xmark"></i> ${dict.exitQuiz}</button>
                    `;

                setTimeout(() => {
                    const input = document.getElementById('spellingInput');
                    if (input) {
                        input.focus();
                        input.addEventListener('keypress', function (e) {
                            if (e.key === 'Enter') checkSpellingAnswer();
                        });
                    }
                    playRealAudio(currentQuestionWord.audio);
                }, 300);
            }
        }

        function checkSpellingAnswer() {
            const inputElement = document.getElementById('spellingInput');
            const submitBtn = document.getElementById('spellingSubmitBtn');
            if (!inputElement) return;

            const userAnswer = inputElement.value.trim().toLowerCase();
            const currentQuestionWord = quizQuestions[quizStep];
            const correctAnswer = currentQuestionWord.name.trim().toLowerCase();
            const dict = translations[currentLang] || translations['en'];

            inputElement.disabled = true;
            submitBtn.disabled = true;
            submitBtn.style.pointerEvents = 'none';

            if (userAnswer === correctAnswer) {
                inputElement.classList.add('correct');
                inputElement.value = dict.correctSpelling;
                playSfx('correct');
                quizScore++;
            } else {
                inputElement.classList.add('wrong');
                inputElement.value = dict.wrongSpelling + ` "${currentQuestionWord.name}"`;
                playSfx('wrong');
            }

            setTimeout(() => {
                quizStep++;
                if (quizStep < quizQuestions.length) {
                    generateQuizQuestion();
                } else {
                    showQuizResult();
                }
            }, 1800);
        }

        function handleQuizAnswer(buttonElement, chosenAnswer, correctAnswer) {
            const allButtons = document.querySelectorAll('.quiz-choice-btn');
            allButtons.forEach(btn => btn.style.pointerEvents = 'none');

            if (chosenAnswer === correctAnswer) {
                buttonElement.classList.add('correct');
                playSfx('correct');
                quizScore++;
            } else {
                buttonElement.classList.add('wrong');
                playSfx('wrong');
                allButtons.forEach(btn => {
                    if (btn.innerText === correctAnswer) btn.classList.add('correct');
                });
            }

            setTimeout(() => {
                quizStep++;
                if (quizStep < quizQuestions.length) {
                    generateQuizQuestion();
                } else {
                    showQuizResult();
                }
            }, 1400);
        }

        function showQuizResult() {
            const displayBox = document.getElementById('displayBox');
            const percent = Math.round((quizScore / quizQuestions.length) * 100);
            const dict = translations[currentLang] || translations['en'];

            if (percent > 60) {
                playSfx('cheer');
            } else {
                playSfx('fail');
            }

            displayBox.classList.remove('flashcard-perspective', 'flipped');
            displayBox.classList.add('quiz-style');

            displayBox.innerHTML = `
                    <i class="fa-solid fa-square-poll-vertical" style="font-size: 46px; color: var(--blue);"></i>
                    <div class="word-title" style="margin-top:10px; direction:initial;">${dict.quizFinished}</div>
                    <p class="sentence-example" style="direction:initial;">${dict.score}: <strong>${quizScore}</strong> / ${quizQuestions.length} (${percent}%)</p>
                    <div class="quiz-choices-container" style="margin-top:15px;">
                        <button class="nav-btn next" onclick="exitQuiz()">${dict.backToFlashcards}</button>
                    </div>
                `;
            updateProgressBar(quizQuestions.length, quizQuestions.length);
        }

        function exitQuiz() {
            if (currentAudioObject) currentAudioObject.pause();
            isQuizMode = false;

            const displayBox = document.getElementById('displayBox');
            if (displayBox) displayBox.style.display = 'block';

            renderCard();
        }

        window.addEventListener('languageChanged', function (e) {
            if (typeof renderCard === 'function') {
                renderCard();
            }
        });
    </script>
</body>

</html>
