<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinguFun</title>
    <link rel="stylesheet" href="../../../../../Assets/CSS/flashcard.css">
</head>

<body>
    <div class="main-body">
        <div class="container def-container">
            <!-- set word inner text to the first (p) name-->
            <p id="word">gebiet</p>
            <p id="answer">?</p>
        </div>
        <div class="container btn-container">
            <button class="definition" name="1">Definition</button>
            <button class="plural" name="2">Plural</button>
            <button class="page-changer" id="next-page">Next</button>
            <button class="page-changer" id="previous-page">Previous</button>
        </div>
    </div>
    <div class="quesrions" style="display: none;">
        <!-- only change name , plural, inner text-->
        <p id="1" name="gebiet" plural="gebiete">area</p>
        <p id="2" name="party" plural="partys">party</p>
        <p id="3" name="sprache" plural="sprachen">language</p>
    </div>
</body>
<script>

    let qid = 1;
    let definition = "";
    let plural = "";
    let wordText = "";
    let defCheck = false;
    let pluralCheck = false;
    // setting this is important
    let topNumber = 3;

    // show definition

    document.getElementsByClassName("definition")[0].addEventListener("click", function () {
        setdefinition();
    })
    function setdefinition() {
        if (defCheck === false) {
            defCheck = true;
            definition = document.getElementById(qid).innerText;
            document.getElementById("answer").innerText = definition;
        }
        else {
            defCheck = false;
            document.getElementById("answer").innerText = "?";
        }
        pluralCheck = false;
    }

    // show plural 
    document.getElementsByClassName("plural")[0].addEventListener("click", function () {
        setplural();
    })
    function setplural() {
        if (pluralCheck === false) {
            pluralCheck = true;
            plural = document.getElementById(qid).getAttribute("plural");
            document.getElementById("answer").innerText = plural;
        }
        else {
            pluralCheck = false;
            document.getElementById("answer").innerText = "?";
        }
        defCheck = false;
    }

    // next and previous btn
    document.getElementById("next-page").addEventListener("click", function () {
        if (qid <= topNumber - 1) {
            qid = qid + 1;
        }
        else {
            qid = 1;
        }
        pagechanger();
    })

    document.getElementById("previous-page").addEventListener("click", function () {
        if (qid >= 2) {
            qid = qid - 1;
        }
        else {
            qid = topNumber;
        }
        pagechanger();
    })

    function pagechanger() {
        document.getElementById("answer").innerText = "?";
        wordText = document.getElementById(qid).getAttribute("name");
        document.getElementById("word").innerText = wordText;
        defCheck = false;
        pluralCheck = false;
    } 
</script>

</html>
