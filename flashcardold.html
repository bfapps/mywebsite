<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Flashcards Studio with Real Audio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-page: #f8fafc;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;

            /* Core Theme Palette */
            --blue: #1d4ed8;
            --blue-hover: #1e40af;
            --blue-light: #eff6ff;
            --gray-btn: #f1f5f9;
            --gray-btn-hover: #e2e8f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-page);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            padding: 0 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        /* Header Layout */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 0;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            font-size: 28px;
            color: var(--blue);
        }

        .logo-text h1 {
            font-size: 18px;
            font-weight: 800;
            color: #030712;
            line-height: 1.1;
        }

        .logo-text p {
            font-size: 12px;
            color: var(--text-muted);
        }

        .go-home-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #ffffff;
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-dark);
            text-decoration: none;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.02);
            transition: all 0.2s ease;
        }

        .go-home-btn:hover {
            background: #f1f5f9;
            transform: translateY(-1px);
        }

        /* Main Flashcard Outer Wrapper */
        .flashcard-wrapper {
            background: #ffffff;
            border-radius: 24px;
            border: 1px solid var(--border-color);
            padding: 24px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.04);
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin: 40px 0;
        }

        /* Modern Progress Bar Styling */
        .progress-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 0 4px;
            margin-bottom: 4px;
        }

        .progress-bar-bg {
            flex: 1;
            height: 8px;
            background-color: var(--border-color);
            border-radius: 99px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #3b82f6, var(--blue));
            border-radius: 99px;
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .progress-text {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-muted);
            min-width: 48px;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        /* Inside Display Box */
        .display-box {
            background-color: var(--bg-page);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 32px 24px;
            text-align: center;
            min-height: 190px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 14px;
            transition: all 0.2s ease;
        }

        .word-title {
            font-size: 24px;
            font-weight: 800;
            color: var(--text-dark);
            letter-spacing: -0.5px;
        }

        .sentence-example {
            font-size: 15px;
            color: var(--text-muted);
            line-height: 1.5;
            max-width: 440px;
            font-style: italic;
        }

        /* Hint/Reveal Area */
        .dynamic-hint-area {
            font-size: 15px;
            font-weight: 600;
            color: var(--blue);
            background: var(--blue-light);
            padding: 6px 14px;
            border-radius: 20px;
            margin-top: 6px;
            min-height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            direction: rtl;
        }

        /* Grid for Feature Buttons */
        .features-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .feature-btn {
            background-color: var(--gray-btn);
            border: 1px solid transparent;
            color: var(--text-dark);
            padding: 12px 8px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .feature-btn i {
            font-size: 14px;
            color: var(--text-muted);
            transition: color 0.2s ease;
        }

        .feature-btn:hover {
            background-color: var(--gray-btn-hover);
        }

        .feature-btn.active {
            background-color: var(--blue-light);
            border-color: rgba(29, 78, 216, 0.2);
            color: var(--blue);
        }

        .feature-btn.active i {
            color: var(--blue);
        }

        /* Navigation Controls Group */
        .navigation-row {
            display: flex;
            gap: 12px;
            margin-top: 6px;
        }

        .nav-btn {
            flex: 1;
            padding: 14px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
            user-select: none;
        }

        .nav-btn.next {
            background-color: var(--blue);
            color: #ffffff;
            border: none;
            box-shadow: 0 4px 12px rgba(29, 78, 216, 0.15);
        }

        .nav-btn.next:hover {
            background-color: var(--blue-hover);
            transform: translateY(-1px);
        }

        .nav-btn.prev {
            background-color: #ffffff;
            color: var(--text-dark);
            border: 1px solid var(--border-color);
        }

        .nav-btn.prev:hover {
            background-color: var(--bg-page);
        }

        /* Footer Info */
        footer {
            margin-top: auto;
            padding: 24px 0;
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
        }

        @media (max-width: 480px) {
            header {
                padding: 16px 0 8px 0;
            }

            .flashcard-wrapper {
                margin: auto 0;
                padding: 16px;
                border-radius: 20px;
                gap: 14px;
            }

            .display-box {
                padding: 24px 16px;
                min-height: 160px;
                gap: 10px;
            }

            .word-title {
                font-size: 20px;
            }

            .feature-btn {
                padding: 10px 4px;
                font-size: 11px;
            }

            .nav-btn {
                padding: 12px;
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <header>
            <div class="logo-container">
                <i class="fa-solid fa-graduation-cap logo-icon"></i>
                <div class="logo-text">
                    <h1>LinguFun</h1>
                    <p>Flashcards Studio</p>
                </div>
            </div>
            <a href="#" class="go-home-btn">
                <i class="fa-solid fa-house"></i> Home
            </a>
        </header>

        <main class="flashcard-wrapper">

            <div class="progress-container">
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="progressBarFill"></div>
                </div>
                <div class="progress-text" id="progressText">0 / 0</div>
            </div>

            <div class="display-box">
                <div class="word-title" id="wordTitle">Loading...</div>
                <div class="sentence-example" id="wordExample">...</div>
                <div class="dynamic-hint-area" id="hintBox">
                    <i class="fa-solid fa-circle-question"
                        style="margin-right: 6px; opacity: 0.7; font-size: 12px;"></i> Tap clues below
                </div>
            </div>

            <div class="features-grid">
                <button class="feature-btn" onclick="toggleHint('meaning', this)">
                    <i class="fa-solid fa-language"></i>
                    Persian Meaning
                </button>
                <button class="feature-btn" onclick="toggleHint('pronunciation', this)">
                    <i class="fa-solid fa-volume-high"></i>
                    Pronunciation
                </button>
                <button class="feature-btn" onclick="toggleHint('type', this)">
                    <i class="fa-solid fa-tags"></i>
                    Word Type
                </button>
            </div>

            <div class="navigation-row">
                <button class="nav-btn prev" onclick="navigateCard(-1)">
                    <i class="fa-solid fa-arrow-left"></i> Previous
                </button>
                <button class="nav-btn next" onclick="navigateCard(1)">
                    Next <i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>

        </main>

        <footer>
            <p>© 2026 LinguFun. Progress is step by step.</p>
        </footer>
    </div>

    <script src="wordsdata.js"></script>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const selectedUnitKey = urlParams.get('unit') || 'v1u1';

        let flashcardsDataset = allUnitsDatabase[selectedUnitKey] || [
            { id: 1, name: "No words available", pronunciation: "-", example: "Please add words to this unit.", type: "-", meaning: "کلمه‌ای یافت نشد", audio: "" }
        ];

        let currentIndex = 0;
        let currentAudioObject = null; // برای مدیریت فایل صوتی در حال پخش

        function renderCard() {
            const currentWord = flashcardsDataset[currentIndex];
            const totalWords = flashcardsDataset.length;
            const currentPosition = currentIndex + 1;

            document.getElementById('wordTitle').innerText = `${currentPosition}. ${currentWord.name}`;
            document.getElementById('wordExample').innerText = `"${currentWord.example}"`;

            const progressPercent = (currentPosition / totalWords) * 100;
            document.getElementById('progressBarFill').style.width = `${progressPercent}%`;
            document.getElementById('progressText').innerText = `${currentPosition} / ${totalWords}`;

            // اگر در حین پخش صدا کاربر کارت را عوض کرد، صدای قبلی قطع شود
            if (currentAudioObject) {
                currentAudioObject.pause();
                currentAudioObject = null;
            }

            document.querySelectorAll('.feature-btn').forEach(btn => btn.classList.remove('active'));
            const hintBox = document.getElementById('hintBox');
            hintBox.style.direction = "ltr";
            hintBox.innerHTML = '<i class="fa-solid fa-circle-question" style="margin-right: 6px; opacity: 0.7; font-size: 12px;"></i> Tap clues below';
        }

        function navigateCard(direction) {
            currentIndex += direction;

            if (currentIndex >= flashcardsDataset.length) {
                currentIndex = 0;
            } else if (currentIndex < 0) {
                currentIndex = flashcardsDataset.length - 1;
            }

            renderCard();
        }

        // تابع هوشمند پخش فایل صوتی واقعی اختصاصی
        function playRealAudio(audioPath) {
            if (!audioPath) {
                console.warn("No audio file path provided for this word.");
                return;
            }

            // ریست کردن موزیک قبلی اگر هنوز تمام نشده باشد
            if (currentAudioObject) {
                currentAudioObject.pause();
                currentAudioObject.currentTime = 0;
            }

            // ساخت آبجکت صوتی جدید و پخش آن با جاوا اسکریپت
            currentAudioObject = new Audio(audioPath);
            currentAudioObject.play().catch(error => {
                console.error("Audio file could not be played. Please check the file path:", error);
            });
        }

        function toggleHint(type, element) {
            const hintBox = document.getElementById('hintBox');
            const currentWord = flashcardsDataset[currentIndex];
            const isAlreadyActive = element.classList.contains('active');

            document.querySelectorAll('.feature-btn').forEach(btn => btn.classList.remove('active'));

            if (isAlreadyActive) {
                hintBox.style.direction = "ltr";
                hintBox.innerHTML = '<i class="fa-solid fa-circle-question" style="margin-right: 6px; opacity: 0.7; font-size: 12px;"></i> Tap clues below';

                if (type === 'pronunciation' && currentAudioObject) {
                    currentAudioObject.pause();
                }
            } else {
                element.classList.add('active');

                // پخش فایل صوتی حقیقی کلمه هنگام فشردن دکمه Pronunciation
                if (type === 'pronunciation') {
                    playRealAudio(currentWord.audio);
                }

                if (type === 'meaning') {
                    hintBox.style.direction = "rtl";
                } else {
                    hintBox.style.direction = "ltr";
                }

                hintBox.style.opacity = '0';
                setTimeout(() => {
                    hintBox.innerHTML = currentWord[type];
                    hintBox.style.opacity = '1';
                }, 80);
            }
        }

        window.onload = function () {
            renderCard();
        };
    </script>
</body>

</html>
