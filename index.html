<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>LinguFun</title>
        <script src="https://kit.fontawesome.com/32f77a75ad.js" crossorigin="anonymous"></script>
        <link rel="stylesheet" href="Assets/CSS/index.css">
        <link id="theme-selector" rel="stylesheet" href="Assets/CSS/index.css">
    </head>
    <style>
        body {
            align-items:center;
            padding: 0;
        }
        #change-theme {
            top: -50px;
            left: 43%;
        }
    </style>
    <body>
        <div class="main-body">
            <span class="title">Welcome To LinguFun</span>
            <span class="sub-title">A website for all Linguistics Enthusiasts and Language Learners.</span>
            <div style="padding-top: 13px;">
                <a class="main-link" href="Pages/Linguistics.html">Linguistics</a>
                <a class="main-link disabled-link" href="">Teaching</a>
                <a class="main-link disabled-link" href="">Learning</a>
                <a class="main-link disabled-link" href="">Extras</a>
                <a class="main-link" href="Pages/About me/About me.html">About me</a>
            </div>
        <button id="change-theme"><i class="fas fa-sun    "></i></button>
        </div>
    </body>
    <script>
        // function to set first mode of night mode or day mode
        let mode = localStorage.getItem("mode");
        if (mode === "night") {
            document.getElementById("theme-selector").setAttribute('href', 'Assets/CSS/index-night.css');
            document.getElementById("change-theme").innerHTML='<i class="fas fa-moon    "></i>';
        }
        else if (mode === "day") {
            document.getElementById("theme-selector").setAttribute('href', 'Assets/CSS/index.css');
        }
        else {
            const time = new Date().toLocaleTimeString('en-US', {
                hour12: false,
                hour: "numeric",
                minute: "numeric"
            });
            const onlyClock = time.slice(0, 2);
            if (onlyClock >= 17 || onlyClock <= 07) {
                localStorage.setItem("mode", "night");
                document.getElementById("theme-selector").setAttribute('href', 'Assets/CSS/index-night.css');
                document.getElementById("change-theme").innerHTML = '<i class="fas fa-moon    "></i>';
            }
        }
        

        // function to change mode by clicks
        document.getElementById("change-theme").addEventListener("click", function () {
                mode = localStorage.getItem("mode");
                if (mode === "night") {
                    localStorage.setItem("mode", "day");
                    document.getElementById("theme-selector").setAttribute('href', 'Assets/CSS/index.css');
                    document.getElementById("change-theme").innerHTML = '<i class="fas fa-sun    "></i>';
                }
                else if (mode === "day") {
                    localStorage.setItem("mode", "night");
                    document.getElementById("theme-selector").setAttribute('href', 'Assets/CSS/index-night.css');
                    document.getElementById("change-theme").innerHTML = '<i class="fas fa-moon    "></i>';
                }
        })
    </script>
</html>
