<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>LinguFun</title>
        <script src="https://kit.fontawesome.com/32f77a75ad.js" crossorigin="anonymous"></script>
        <link rel="stylesheet" href="../Assets/CSS/index.css">
    </head>
    
    <body>
        <div class="main-body">
            <span class="title">Linguistics</span>
                <div class="image">
                    <img src="../Assets/img/Main/linguistics.jpg" alt="" loading="lazy">
                </div>
            <div style="padding-top: 13px;">
                <a class="main-link" href="Linguistics/22 Nov/Origins of Language.html">Origins of Language</a>
                <a class="main-link" href="Linguistics/22 Nov/Properties of Human Language.html">Properties of Human Language</a>
                <a class="main-link home-link" href="../index.html">Go Home</a>
            </div>
            <button id="change-theme"><i class="fas fa-sun    "></i></button>
        </div>
        
    </body>
    <script>
        // function to check theme
        let mode = localStorage.getItem("mode");
        if (mode === "night") {
            document.getElementById("theme-selector").setAttribute('href', '../Assets/CSS/index-night.css');
            document.getElementById("change-theme").innerHTML = '<i class="fas fa-moon    "></i>';
        }
        else if (mode === "day") {
            document.getElementById("theme-selector").setAttribute('href', '../Assets/CSS/index.css');
            document.getElementById("change-theme").innerHTML = '<i class="fas fa-sun    "></i>';
        }
        // function to change theme by clicks
        document.getElementById("change-theme").addEventListener("click", function () {
            mode = localStorage.getItem("mode");
            if (mode === "night") {
                localStorage.setItem("mode", "day");
                document.getElementById("theme-selector").setAttribute('href', '../Assets/CSS/index.css');
                document.getElementById("change-theme").innerHTML = '<i class="fas fa-sun    "></i>';
            }
            else if (mode === "day") {
                localStorage.setItem("mode", "night");
                document.getElementById("theme-selector").setAttribute('href', '../Assets/CSS/index-night.css');
                document.getElementById("change-theme").innerHTML = '<i class="fas fa-moon    "></i>';
            }
        })
    </script>
</html>
