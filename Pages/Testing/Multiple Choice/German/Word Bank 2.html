<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinguFun</title>
    <link rel="stylesheet" href="../../../../Assets/CSS/Multiple Choice.css">
</head>

<body>
    <div class="main-body">
        <div class="question" id="question" name="3">bild</div>
        <div class="answers-div">
            <button class="answer-btn" id="a1" name="1">der</button>
            <button class="answer-btn" id="a2" name="2">die</button>
            <button class="answer-btn" id="a3" name="3">das</button>
            <button class="page-changer" id="next-page">Next</button>
            <button class="page-changer" id="previous-page">Previous</button>
        </div>
    </div>
    <div class="quesrions" style="display: none;">
        <p id="1" name="3">bild</p>
        <p id="2" name="3">drehbuch</p>
        <p id="3" name="1">ausschnitt</p>
        <p id="4" name="2">familie</p>
        <p id="5" name="2">sprachkentnisse</p>
        <p id="6" name="3">lexikon</p>
        <p id="7" name="1">zettel</p>
        <p id="8" name="2">seite</p>
        <p id="9" name="2">sprache</p>
        <p id="10" name="2">tabelle</p>
        <p id="11" name="3">mitglied</p>
        <p id="12" name="1">mensch</p>
        <p id="13" name="3">interview</p>
        <p id="14" name="2">notiz</p>
        <p id="15" name="3">land</p>
        <p id="16" name="3">gebiet</p>
        <p id="17" name="2">auflösung</p>
        <p id="18" name="2">hilfe</p>
        <p id="19" name="1">kurs</p>
        <p id="20" name="2">statistik</p>
    </div>
</body>
<script>
    let qid = 1;
    let btnNumber = 0;
    let answer = 3;
    let clickedBtn = 0;
    let questionText = "";
    let questionName = "";
    document.querySelectorAll(".answer-btn")[0].addEventListener("click", function () {
        btnNumber = 1;
        check();
    });
    document.querySelectorAll(".answer-btn")[1].addEventListener("click", function () {
        btnNumber = 2;
        check();
    });
    document.querySelectorAll(".answer-btn")[2].addEventListener("click", function () {
        btnNumber = 3;
        check();
    });
    document.getElementById("next-page").addEventListener("click", function () {
        if (qid <= 19) {
            qid = qid + 1;
            next();
        }
        else {
            qid = 1;
            next();
        }

    })
    document.getElementById("previous-page").addEventListener("click", function () {
        if (qid >= 2) {
            qid = qid - 1;
            previous();
        }
        else {
            qid = 20;
            previous();
        }
    })
    function check() {
        let answer = document.getElementById(qid).getAttribute("name");
        clickedBtn = "a" + btnNumber;
        if (btnNumber == answer) {
            document.getElementById(clickedBtn).style.backgroundColor = "#34c759";
            document.getElementById(clickedBtn).style.color = "white";
        }
        else {
            document.getElementById(clickedBtn).style.backgroundColor = "#ff3b30";
            document.getElementById(clickedBtn).style.color = "white";
        }
    }

    function next() {
        clearAll();
        questionText = document.getElementById(qid).innerText;
        questionName = document.getElementById(qid).getAttribute("name");
        document.getElementById("question").innerText = questionText;
        document.getElementById("question").setAttribute("name", questionName);
    }
    function previous() {
        clearAll();
        questionText = document.getElementById(qid).innerText;
        questionName = document.getElementById(qid).getAttribute("name");
        document.getElementById("question").innerText = questionText;
        document.getElementById("question").setAttribute("name", questionName);
    }
    function clearAll() {
        document.querySelectorAll(".answer-btn")[0].style.backgroundColor = "#f2f2f2";
        document.querySelectorAll(".answer-btn")[1].style.backgroundColor = "#f2f2f2";
        document.querySelectorAll(".answer-btn")[2].style.backgroundColor = "#f2f2f2";
        document.querySelectorAll(".answer-btn")[0].style.color = "black";
        document.querySelectorAll(".answer-btn")[1].style.color = "black";
        document.querySelectorAll(".answer-btn")[2].style.color = "black";
    }
</script>

</html>
