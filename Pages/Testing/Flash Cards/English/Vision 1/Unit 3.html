<body>
    <div class="main-body">
        <div class="container def-container">
            <!-- set word inner text to the first (p) name-->
            <p id="word">1. medicine</p>
            <p id="example-text">Razi taught medicine to many young people.</p>
            <p id="answer">?</p>
        </div>
        <div class="container btn-container">
            <button class="definition" name="1">Persian Meaning</button>
            <button class="pronunciation" name="2">Pronunciation</button>
            <button class="example" name="3">Type</button>
            <button class="page-changer" id="next-page">Next</button>
            <button class="page-changer" id="previous-page">Previous</button>
        </div>
    </div>
    <div class="quesrions" style="display: none;">
        <!-- only change name , pronunciation, example, inner text(definition)-->
        <p id="1" name="medicine" pronunciation="/ˈmed.ɪ.sən/" example="Razi taught medicine to many young people." ep="noun">دارو - داروسازی</p>
        <p id="2" name="famous" pronunciation="/ˈfeɪ.məs/" example="I was reading a book about famous Iranian scientists." ep="adjective">مشهور</p>
        <p id="3" name="build" pronunciation="/bɪld/" example="Nasireddin Toosi built Maragheh Observatory" ep="verb">ساختن</p>
        <p id="4" name="Believe me!" pronunciation="/bɪˈliːv miː/" example="At first I had the same idea, believe me!" ep="phrase">باورم کن</p>
        <p id="5" name="Cool!" pronunciation="/kuːl/" example="-" ep="adjective">چه جالب</p>
        <p id="6" name="try" pronunciation="/traɪ/" example="Melika tries hard to learn English." ep="verb">تلاش کردن</p>
        <p id="7" name="energetic" pronunciation="/ˌen.ɚˈdʒet̬.ɪk/" example="Babak is an energetic boy." ep="adjective">پر انرژی</p>
        <p id="8" name="do an experiment" pronunciation="/ɪkˈsper.ə.mənt/" example="The students do experiments in the school laboratory." ep="phrase">آزمایش کردن</p>
        <p id="9" name="grow up" pronunciation="/ɡroʊ ʌp/" example="Children grow up rapidly." ep="verb">بزرگ شدن</p>
        <p id="10" name="do a research" pronunciation="/rɪˈsɝːtʃ/" example="She is doing research on blood cells." ep="phrase">تحقیق کردن</p>
        <p id="11" name="feel weak" pronunciation="/fiːl wiːk/" example="He has the flu and feels weak." ep="phrase">احساس ضعف کردن</p>
        <p id="12" name="success" pronunciation="/səkˈses/" example="No success is possible without hard work." ep="noun">موفقیت</p>
        <p id="13" name="invent" pronunciation="/ɪnˈvent/" example="Edison invented the first light bulb." ep="verb">اختراع کردن</p>
        <p id="14" name="solve" pronunciation="/sɑːlv/" example="We can help you solve your problems." ep="verb">حل کردن</p>
        <p id="15" name="develop" pronunciation="/dɪˈvel.əp/" example="This book can develop your speaking skill." ep="verb">گسترش دادن - توسعه دادن</p>
        <p id="16" name="belief" pronunciation="/bɪˈliːf/" example="Her belief in Allah gave her hope during diff icult times." ep="noun">اعتقاد</p>
        <p id="17" name="quit / give up" pronunciation="/kwɪt - ɡɪv ʌp/" example="1- Fortunately, his father is going to quit smoking. 2-He gave up his work without saying anything to us." ep="verb">ترک کردن - تسلیم شدن</p>
        <p id="18" name="thousands of" pronunciation="/ˈθaʊzəndz əv/" example="There are thousands of things I want to do." ep="number">هزاران</p>

    </div>
