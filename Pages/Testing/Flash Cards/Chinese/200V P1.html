<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinguFun</title>
    <link rel="stylesheet" href="../../../../Assets/CSS/flashcard.css">
</head>

<body>
    <div class="main-body">
        <div class="container def-container">
            <!-- set word inner text to the first (p) name-->
            <p id="word">看</p>
            <p id="answer">?</p>
        </div>
        <div class="container btn-container">
            <button class="definition" name="1">Definition</button>
            <button class="pronunciation" name="2">Pronunciation</button>
            <button class="example" name="3">Example</button>
            <button class="page-changer" id="next-page">Next</button>
            <button class="page-changer" id="previous-page">Previous</button>
        </div>
    </div>
    <div class="quesrions" style="display: none;">
        <!-- only change name , pronunciation, inner text-->
        <p id="1" name="看" pronunciation="Kàn" example="你看。那是什么？">look</p>
        <p id="2" name="喜欢" pronunciation="Xǐhuān" example="你喜欢什么颜色?">to like</p>
        <p id="3" name="想" pronunciation="Xiǎng" example="我想去中国学汉语。">to want (followed by a verb)</p>
        <p id="4" name="想要" pronunciation="Xiǎng yào" example="我不想要孩子。">to want (followed by a noun)</p>
        <p id="5" name="去" pronunciation="Qù" example="我明天去日本。">to go</p>
        <p id="6" name="会" pronunciation="Huì" example="你会说汉语吗？">can (know how to do sth)</p>
        <p id="7" name="做" pronunciation="Zuò" example="你明天想做什么？">to do / make</p>
        <p id="8" name="有" pronunciation="Yǒu" example="我有一个问题。">to have</p>
        <p id="9" name="没有" pronunciation="Méiyǒu" example="我没有女朋友">to not have</p>
        <p id="10" name="在" pronunciation="Zài" example="我在上海， 你呢？">to be (in a location)</p>
        <p id="11" name="听" pronunciation="Tīng" example="我喜欢听这种音乐。">to listen</p>
        <p id="12" name="吃" pronunciation="Chī" example="我吃你的饼干。">to eat</p>
        <p id="13" name="喝" pronunciation="Hē" example="他和朋友去喝酒了。">to drink</p>
        <p id="14" name="玩" pronunciation="Wán" example="我可以玩你的手机马？">to play</p>
        <p id="15" name="写" pronunciation="Xiě" example="我还不会写汉字。">to write</p>
        
    </div>
</body>
<script>

    let qid = 1;
    let definition = "";
    let pronunciation = "";
    let example = "";
    let wordText = "";
    let defCheck = false;
    let pronunciationCheck = false;
    let exampleCheck = false;
    // setting this is important 40
    let topNumber = 15;

    // show definition

    document.getElementsByClassName("definition")[0].addEventListener("click", function () {
        setdefinition();
    })
    function setdefinition() {
        if (defCheck === false) {
            defCheck = true;
            definition = document.getElementById(qid).innerText;
            document.getElementById("answer").innerText = definition;
        }
        else {
            defCheck = false;
            document.getElementById("answer").innerText = "?";
        }
        pronunciationCheck = false;
        exampleCheck = false;
    }

    // show pronunciation 
    document.getElementsByClassName("pronunciation")[0].addEventListener("click", function () {
        setpronunciation();
    })
    function setpronunciation() {
        if (pronunciationCheck === false) {
            pronunciationCheck = true;
            pronunciation = document.getElementById(qid).getAttribute("pronunciation");
            document.getElementById("answer").innerText = pronunciation;
        }
        else {
            pronunciationCheck = false;
            document.getElementById("answer").innerText = "?";
        }
        defCheck = false;
        exampleCheck = false;
    }

    // Show example
    document.getElementsByClassName("example")[0].addEventListener("click", function () {
        setexample ();
    })
    function setexample () {
        if (exampleCheck === false) {
            exampleCheck = true;
            example = document.getElementById(qid).getAttribute("example");
            document.getElementById("answer").innerText = example;
        }
        else {
            exampleCheck = false;
            document.getElementById("answer").innerText = "?";
        }
        defCheck = false;
        pronunciationCheck = false;
    }

    // next and previous btn
    document.getElementById("next-page").addEventListener("click", function () {
        if (qid <= topNumber - 1) {
            qid = qid + 1;
        }
        else {
            qid = 1;
        }
        pagechanger();
    })

    document.getElementById("previous-page").addEventListener("click", function () {
        if (qid >= 2) {
            qid = qid - 1;
        }
        else {
            qid = topNumber;
        }
        pagechanger();
    })

    function pagechanger() {
        document.getElementById("answer").innerText = "?";
        wordText = document.getElementById(qid).getAttribute("name");
        document.getElementById("word").innerText = wordText;
        defCheck = false;
        pronunciationCheck = false;
        exampleCheck = false;
    } 
</script>

</html>
