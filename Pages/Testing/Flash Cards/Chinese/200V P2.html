<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinguFun</title>
    <link rel="stylesheet" href="../../../../Assets/CSS/flashcard.css">
</head>

<body>
    <div class="main-body">
        <div class="container def-container">
            <!-- set word inner text to the first (p) name-->
            <p id="word">怕</p>
            <p id="answer">?</p>
        </div>
        <div class="container btn-container">
            <button class="definition" name="1">Definition</button>
            <button class="pronunciation" name="2">Pronunciation</button>
            <button class="example" name="3">Example</button>
            <button class="page-changer" id="next-page">Next</button>
            <button class="page-changer" id="previous-page">Previous</button>
        </div>
    </div>
    <div class="quesrions" style="display: none;">
        <!-- only change name , pronunciation, example, inner text(definition)-->
        <p id="1" name="怕" pronunciation="Pà" example="你怕什么？">to fear / to be afraid of</p>
        <p id="2" name="" pronunciation="" example=""></p>
        <p id="3" name="" pronunciation="" example=""></p>
        <p id="4" name="" pronunciation="" example=""></p>
        <p id="5" name="" pronunciation="" example=""></p>
        <p id="6" name="" pronunciation="" example=""></p>
        <p id="7" name="" pronunciation="" example=""></p>
        <p id="8" name="" pronunciation="" example=""></p>
        <p id="9" name="" pronunciation="" example=""></p>
        <p id="10" name="" pronunciation="" example=""></p>
        <p id="11" name="" pronunciation="" example=""></p>
        <p id="12" name="" pronunciation="" example=""></p>
        <p id="13" name="" pronunciation="" example=""></p>
        <p id="14" name="" pronunciation="" example=""></p>
        <p id="15" name="" pronunciation="" example=""></p>
        
    </div>
</body>
<script>

    let qid = 1;
    let definition = "";
    let pronunciation = "";
    let example = "";
    let wordText = "";
    let defCheck = false;
    let pronunciationCheck = false;
    let exampleCheck = false;
    // setting this is important 30
    let topNumber = 15;

    // show definition

    document.getElementsByClassName("definition")[0].addEventListener("click", function () {
        setdefinition();
    })
    function setdefinition() {
        if (defCheck === false) {
            defCheck = true;
            definition = document.getElementById(qid).innerText;
            document.getElementById("answer").innerText = definition;
        }
        else {
            defCheck = false;
            document.getElementById("answer").innerText = "?";
        }
        pronunciationCheck = false;
        exampleCheck = false;
    }

    // show pronunciation 
    document.getElementsByClassName("pronunciation")[0].addEventListener("click", function () {
        setpronunciation();
    })
    function setpronunciation() {
        if (pronunciationCheck === false) {
            pronunciationCheck = true;
            pronunciation = document.getElementById(qid).getAttribute("pronunciation");
            document.getElementById("answer").innerText = pronunciation;
        }
        else {
            pronunciationCheck = false;
            document.getElementById("answer").innerText = "?";
        }
        defCheck = false;
        exampleCheck = false;
    }

    // Show example
    document.getElementsByClassName("example")[0].addEventListener("click", function () {
        setexample();
    })
    function setexample() {
        if (exampleCheck === false) {
            exampleCheck = true;
            example = document.getElementById(qid).getAttribute("example");
            document.getElementById("answer").innerText = example;
        }
        else {
            exampleCheck = false;
            document.getElementById("answer").innerText = "?";
        }
        defCheck = false;
        pronunciationCheck = false;
    }

    // next and previous btn
    document.getElementById("next-page").addEventListener("click", function () {
        if (qid <= topNumber - 1) {
            qid = qid + 1;
        }
        else {
            qid = 1;
        }
        pagechanger();
    })

    document.getElementById("previous-page").addEventListener("click", function () {
        if (qid >= 2) {
            qid = qid - 1;
        }
        else {
            qid = topNumber;
        }
        pagechanger();
    })

    function pagechanger() {
        document.getElementById("answer").innerText = "?";
        wordText = document.getElementById(qid).getAttribute("name");
        document.getElementById("word").innerText = wordText;
        defCheck = false;
        pronunciationCheck = false;
        exampleCheck = false;
    } 
</script>

</html>
