<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinguFun</title>
    <link rel="stylesheet" href="../../../../Assets/CSS/flashcard.css">
</head>

<body>
    <div class="main-body">
        <div class="container def-container">
            <!-- set word inner text to the first (p) name-->
            <p id="word">怕</p>
            <p id="answer">?</p>
        </div>
        <div class="container btn-container">
            <button class="definition" name="1">Definition</button>
            <button class="pronunciation" name="2">Pronunciation</button>
            <button class="example" name="3">Example</button>
            <button class="page-changer" id="next-page">Next</button>
            <button class="page-changer" id="previous-page">Previous</button>
        </div>
    </div>
    <div class="quesrions" style="display: none;">
        <!-- only change name , pronunciation, example, inner text(definition)-->
        <p id="1" name="怕" pronunciation="Nǐ pà shénme?" example="你怕什么？">to fear / to be afraid of</p>
        <p id="2" name="用" pronunciation="Nǐ huì yòng kuàizi ma?" example="你会用筷子吗？">to use</p>
        <p id="3" name="给" pronunciation="Tā gěile wǒ yīgè yǒngbào." example="他给了我一个拥抱。">to give</p>
        <p id="4" name="试" pronunciation="Ràng wǒ shì yīxià." example="让我试一下。"></p>
        <p id="5" name="问" pronunciation="" example="你问了他妈？"></p>
        <p id="6" name="需要" pronunciation="" example="我需要你的帮助。"></p>
        <p id="7" name="相信" pronunciation="" example="我不相信你说的话。"></p>
        <p id="8" name="坐" pronunciation="" example="请坐！"></p>
        <p id="9" name="明白" pronunciation="" example="我明白你的意思。"></p>
        <p id="10" name="花" example="你今天花了很多钱。" pronunciation=""></p>
        <p id="11" name="记得" example="我不记得了。" pronunciation=""></p>
        <p id="12" name="爱" example="我爱你。" pronunciation=""></p>
        <p id="13" name="死" example="他的小猫昨天死了。" pronunciation=""></p>
        <p id="14" name="考虑" example="我才考虑辞职。" pronunciation=""></p>
        <p id="15" name="准备" example="我妈妈在准备晚饭。" pronunciation=""></p>
        <p id="16" name="睡觉" example="你晚上工作，白天睡觉" pronunciation=""></p>
        <p id="17" name="洗" example="你应该自己洗衣服。" pronunciation=""></p>
        <p id="18" name="希望" example="我希望你能原谅我。" pronunciation=""></p>
        <p id="19" name="休息" example="我想休息几天。" pronunciation=""></p>
        <p id="20" name="笑" example="你笑什么?" pronunciation=""></p>
        
    </div>
</body>
<script>

    let qid = 1;
    let definition = "";
    let pronunciation = "";
    let example = "";
    let wordText = "";
    let defCheck = false;
    let pronunciationCheck = false;
    let exampleCheck = false;
    // setting this is important 30
    let topNumber = 15;

    // show definition

    document.getElementsByClassName("definition")[0].addEventListener("click", function () {
        setdefinition();
    })
    function setdefinition() {
        if (defCheck === false) {
            defCheck = true;
            definition = document.getElementById(qid).innerText;
            document.getElementById("answer").innerText = definition;
        }
        else {
            defCheck = false;
            document.getElementById("answer").innerText = "?";
        }
        pronunciationCheck = false;
        exampleCheck = false;
    }

    // show pronunciation 
    document.getElementsByClassName("pronunciation")[0].addEventListener("click", function () {
        setpronunciation();
    })
    function setpronunciation() {
        if (pronunciationCheck === false) {
            pronunciationCheck = true;
            pronunciation = document.getElementById(qid).getAttribute("pronunciation");
            document.getElementById("answer").innerText = pronunciation;
        }
        else {
            pronunciationCheck = false;
            document.getElementById("answer").innerText = "?";
        }
        defCheck = false;
        exampleCheck = false;
    }

    // Show example
    document.getElementsByClassName("example")[0].addEventListener("click", function () {
        setexample();
    })
    function setexample() {
        if (exampleCheck === false) {
            exampleCheck = true;
            example = document.getElementById(qid).getAttribute("example");
            document.getElementById("answer").innerText = example;
        }
        else {
            exampleCheck = false;
            document.getElementById("answer").innerText = "?";
        }
        defCheck = false;
        pronunciationCheck = false;
    }

    // next and previous btn
    document.getElementById("next-page").addEventListener("click", function () {
        if (qid <= topNumber - 1) {
            qid = qid + 1;
        }
        else {
            qid = 1;
        }
        pagechanger();
    })

    document.getElementById("previous-page").addEventListener("click", function () {
        if (qid >= 2) {
            qid = qid - 1;
        }
        else {
            qid = topNumber;
        }
        pagechanger();
    })

    function pagechanger() {
        document.getElementById("answer").innerText = "?";
        wordText = document.getElementById(qid).getAttribute("name");
        document.getElementById("word").innerText = wordText;
        defCheck = false;
        pronunciationCheck = false;
        exampleCheck = false;
    } 
</script>

</html>
